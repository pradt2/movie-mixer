[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-editor"
version = "0.1.0"
description = "Non-destructive desktop video editor for combining audio and video from different editions of a film"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
video-editor = "video_editor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
